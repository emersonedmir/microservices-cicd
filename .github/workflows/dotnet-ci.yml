name: Reusable .NET CI

on:
  workflow_call:
    inputs:
      solution-path:
        required: true
        type: string
      dotnet-version:
        type: string
        default: "10.0.x"
      test-project-path:
        type: string
        default: ""

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - run: dotnet restore "${{ inputs.solution-path }}"

      - run: dotnet build "${{ inputs.solution-path }}" -c Release --no-restore

      - if: inputs.test-project-path != ''
        run: dotnet test "${{ inputs.test-project-path }}" -c Release --logger trx
