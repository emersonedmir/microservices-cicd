name: Reusable .NET CI

on:
  workflow_call:
    inputs:
      solution-path:
        description: "Ruta del archivo .sln o .csproj"
        required: true
        type: string

      dotnet-version:
        description: "Versión del SDK de .NET"
        required: false
        type: string
        default: "10.0.x"

      test-project-path:
        description: "Ruta del proyecto de pruebas .csproj"
        required: false
        type: string
        default: ""

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore "${{ inputs.solution-path }}"

      - name: Build solution
        run: dotnet build "${{ inputs.solution-path }}" --configuration Release --no-restore

      - name: Run tests
        if: ${{ inputs.test-project-path != '' }}
        run: dotnet test "${{ inputs.test-project-path }}" --configuration Release --logger "trx"